name: Sharepatch release

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      publication:
        description: Publication mode (manual runs default to an isolated pre-release)
        required: true
        type: choice
        options:
          - prerelease
          - release
        default: prerelease

concurrency:
  group: sharepatch-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.upstream_tag }}
      sha: ${{ steps.upstream.outputs.upstream_sha }}
      version: ${{ steps.publication.outputs.version }}
      prerelease: ${{ steps.publication.outputs.prerelease }}
      skip: ${{ steps.existing.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve latest upstream formal release and fixed commit
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve-upstream.py --github-output "$GITHUB_OUTPUT"
      - name: Choose isolated pre-release version for manual builds
        id: publication
        env:
          BASE_VERSION: ${{ steps.upstream.outputs.release_version }}
          PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publication == 'prerelease' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          version = os.environ["BASE_VERSION"]
          prerelease = os.environ["PRE_RELEASE"] == "true"
          if prerelease:
              version += f"-preview.{os.environ['RUN_ID']}.{os.environ['RUN_ATTEMPT']}"
          print(f"version={version}")
          print(f"prerelease={str(prerelease).lower()}")
          PY
      - name: Inspect release provenance and completeness before deciding to skip
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHAREPATCH_VERSION: v${{ steps.publication.outputs.version }}
          SHAREPATCH_PRERELEASE: ${{ steps.publication.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: python3 scripts/publish-release.py preflight

  build-test-publish:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sharepatch
          POSTGRES_PASSWORD: sharepatch
          POSTGRES_DB: sharepatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharepatch -d sharepatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
      SHAREPATCH_REPO: ${{ github.repository }}
      SHAREPATCH_TEST_DATABASE_URL: postgres://sharepatch:sharepatch@127.0.0.1:5432/sharepatch_test?sslmode=disable
      SHAREPATCH_VERSION: v${{ needs.resolve.outputs.version }}
      SHAREPATCH_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: Wei-Shaw/sub2api
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: upstream/backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: upstream/frontend/pnpm-lock.yaml

      - name: Apply sharepatch and Codex customization to the resolved upstream commit
        run: |
          python3 scripts/apply-overlay.py \
            --upstream upstream \
            --upstream-sha "$UPSTREAM_SHA" \
            --patch-repo "$GITHUB_REPOSITORY"
          python3 scripts/apply-codex-customizations.py \
            --upstream upstream \
            --upstream-sha "$UPSTREAM_SHA"
          cd upstream/backend/cmd/server
          go run -mod=mod github.com/google/wire/cmd/wire

      - name: Install and verify frontend
        working-directory: upstream/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test:run
          pnpm run build

      - name: Run Go unit tests
        working-directory: upstream/backend
        run: go test -tags=unit ./...

      - name: Run PostgreSQL and container integration tests
        working-directory: upstream/backend
        run: go test -tags=integration ./...

      - name: Build linux/amd64 release archive and checksums
        run: |
          python3 scripts/build-release-assets.py \
            --upstream upstream \
            --version "$SHAREPATCH_VERSION" \
            --upstream-tag "$UPSTREAM_TAG" \
            --upstream-sha "$UPSTREAM_SHA" \
            --patch-repo "$GITHUB_REPOSITORY" \
            --output release-assets \
            --docker-context release-image

      - uses: docker/setup-buildx-action@v3

      - name: Prepare isolated image candidate and release tag
        id: image
        run: |
          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "candidate=$image_name:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "versioned=$image_name:$SHAREPATCH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package the verified release binary using the upstream runtime Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: release-image
          file: release-image/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ steps.image.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.SHAREPATCH_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.sub2api.sharepatch.upstream-revision=${{ env.UPSTREAM_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image binary, runtime user, updater permissions, resources, and backup tools
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.candidate }}
        run: bash scripts/verify-release-image.sh "$CANDIDATE_IMAGE" release-image "$SHAREPATCH_VERSION" "$UPSTREAM_SHA"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the checked candidate and bind its immutable digest to the release
        id: pushed
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.candidate }}
        run: |
          docker push "$CANDIDATE_IMAGE"
          image_ref=$(docker image inspect "$CANDIDATE_IMAGE" --format '{{index .RepoDigests 0}}')
          python3 scripts/publish-release.py bind-image --image "$image_ref"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          Shared-billing patch build for upstream ${UPSTREAM_TAG}.

          - Upstream source commit: ${UPSTREAM_SHA}
          - Patch commit: ${GITHUB_SHA}
          - Docker image: ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):${SHAREPATCH_VERSION}
          - Compose users can update only the application image to the GHCR image above.
          EOF
          if [ "$SHAREPATCH_PRERELEASE" = 'true' ]; then
            cat >> release-notes.md <<EOF

          This isolated pre-release is for build validation. It does not update the latest image tag or the latest release pointer.
          EOF
          fi

      - name: Upload and verify all assets in a resumable draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-release.py stage

      - name: Tag the verified image with its release version
        env:
          VERSIONED_IMAGE: ${{ steps.image.outputs.versioned }}
          VERIFIED_IMAGE_REF: ${{ steps.pushed.outputs.image_ref }}
        run: docker buildx imagetools create --prefer-index=false --tag "$VERSIONED_IMAGE" "$VERIFIED_IMAGE_REF"

      - name: Publish the complete release without changing latest pointers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-release.py publish

  promote:
    needs: [resolve, build-test-publish]
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.prerelease == 'false' &&
      (needs.build-test-publish.result == 'success' ||
       (needs.build-test-publish.result == 'skipped' && needs.resolve.outputs.skip == 'true'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHAREPATCH_VERSION: v${{ needs.resolve.outputs.version }}
      SHAREPATCH_PRERELEASE: 'false'
      UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recheck published artifacts and prevent promotion of an older version
        id: release
        run: python3 scripts/publish-release.py inspect
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.promote == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the recorded digest to the version tag and latest
        if: steps.release.outputs.promote == 'true'
        env:
          VERIFIED_IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          image_name=${VERIFIED_IMAGE_REF%@*}
          docker buildx imagetools create --prefer-index=false \
            --tag "$image_name:$SHAREPATCH_VERSION" --tag "$image_name:latest" "$VERIFIED_IMAGE_REF"
      - name: Advance the webpage update channel after image promotion succeeds
        if: steps.release.outputs.promote == 'true'
        run: python3 scripts/publish-release.py activate
