name: Overlay CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.upstream_sha }}
      tag: ${{ steps.upstream.outputs.upstream_tag }}
      version: ${{ steps.upstream.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check patch guards and test partitioning
        run: python3 -m unittest discover -s scripts/tests
      - name: Resolve the upstream release once for CI and publication
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve-upstream.py --github-output "$GITHUB_OUTPUT"

  verify:
    needs: baseline
    uses: ./.github/workflows/verify.yml
    with:
      upstream-sha: ${{ needs.baseline.outputs.sha }}
      upstream-tag: ${{ needs.baseline.outputs.tag }}
      version: ${{ needs.baseline.outputs.version }}

  release:
    needs: [baseline, verify]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      upstream-sha: ${{ needs.baseline.outputs.sha }}
      upstream-tag: ${{ needs.baseline.outputs.tag }}
      version: ${{ needs.baseline.outputs.version }}
      verified-artifact: ${{ needs.verify.outputs.artifact-name }}
